<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Ziņas">
<title>Ziņu lasītājs</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="home">
<div id="warn" role="alert"></div>

<main id="home">
  <button id="btnLsm" class="big lsm" type="button">
    <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 24h12l16-13v42L20 40H8z" fill="currentColor"/><path d="M44 22a14 14 0 0 1 0 20M50 15a24 24 0 0 1 0 34" stroke="currentColor" stroke-width="5" fill="none" stroke-linecap="round"/></svg>
    <span class="lbl">Klausīties ziņas</span>
    <span class="sub">no interneta · LSM</span>
  </button>
  <button id="btnPhoto" class="big photo" type="button" hidden>
    <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M6 20h12l5-7h18l5 7h12v32H6z" fill="currentColor"/><circle cx="32" cy="35" r="11" fill="#fff"/><circle cx="32" cy="35" r="6.5" fill="currentColor"/></svg>
    <span class="lbl">Lasīt avīzi</span>
    <span class="sub">nofotografēt lapu</span>
  </button>
</main>

<main id="stage" hidden>
  <div id="status"></div>
  <div id="main"><span id="mainText"></span></div>
  <div id="bar"><i></i></div>
  <div id="hint"></div>
</main>

<footer id="panel">
  <span id="keys">
    <kbd>Atstarpe</kbd> poga · turēt 1 s = stop ·
    <kbd>A</kbd> avīze · <kbd>1</kbd>–<kbd>9</kbd> balss · <kbd>+</kbd><kbd>−</kbd> ātrums ·
    <kbd>T</kbd> apraksts · <kbd>I</kbd> paskaidrojums · <kbd>V</kbd> vieglā valoda · <kbd>R</kbd> atjaunot · <kbd>Esc</kbd> stop
  </span>
  <button id="gear" type="button">⚙ Iestatījumi</button>
</footer>

<div id="settings" hidden>
  <div class="sheet">
    <h2>Iestatījumi</h2>
    <section>
      <h3>Balss</h3>
      <div id="voiceList" class="choices"></div>
    </section>
    <section>
      <h3>Runas ātrums</h3>
      <div class="row">
        <button id="slower" class="pill" type="button" aria-label="Lēnāk">−</button>
        <b id="rateVal"></b>
        <button id="faster" class="pill" type="button" aria-label="Ātrāk">+</button>
      </div>
    </section>
    <section>
      <h3>Pēc virsraksta nolasīt arī īsu aprakstu (LSM)</h3>
      <button id="teaserBtn" class="pill wide" type="button"></button>
    </section>
    <section class="stack">
      <button id="introBtn" class="pill wide" type="button">Atskaņot paskaidrojumu no jauna</button>
      <button id="reloadBtn" class="pill wide" type="button">Ielādēt ziņas no jauna</button>
    </section>
    <p id="about" class="small"></p>
    <button id="closeSettings" class="pill close" type="button">Aizvērt</button>
  </div>
</div>

<input id="camera" type="file" accept="image/*" capture="environment" hidden>
<audio id="ttsAudio" preload="auto"></audio>
<audio id="newsAudio" preload="none"></audio>
<script src="app.js"></script>
</body>
</html>
